; PlatformIO Project Configuration File for SIH Defence ANC
; Target Board: ESP32-S3 DevKitC-1 N16R8 (16MB Flash, 8MB Octal PSRAM)
; Architecture: Xtensa Dual-Core LX7 @ 240MHz

[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32 @ 6.8.1
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 115200
monitor_speed = 115200
upload_port = COM10

; CPU Frequency (Maximum 240 MHz for real-time DSP performance)
board_build.f_cpu = 240000000L

; Flash & PSRAM Configuration for N16R8 module
; N16 = 16MB Quad Flash, R8 = 8MB Octal PSRAM (OPI)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv


; Build Flags: Enable PSRAM, SIMD optimizations, and USB CDC Serial
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -O3
    -DCORE_DEBUG_LEVEL=3

; Serial Monitor Settings
monitor_filters = send_on_enter
monitor_echo = yes   


; upload_speed = 921600
